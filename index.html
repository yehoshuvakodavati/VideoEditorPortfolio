<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rudhra | Video Editor</title>
<meta name="description" content="Rudhra is a video editor creating cinematic, scroll-stopping edits for creators and brands.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;700&display=swap">
<style>
:root{--bg:#0b1022;--line:#2b3566;--text:#e7ecff;--mute:#a4aedb;--cy:#52e4ff;--pk:#ff5c8a;color-scheme:dark}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:400 1rem/1.6 Manrope,system-ui,sans-serif;overflow-x:hidden}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
nav{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:calc(18px + env(safe-area-inset-top,0px)) 24px 18px}
nav b{font:700 1rem Unbounded,sans-serif;letter-spacing:.06em}
nav a{color:var(--mute);text-decoration:none;margin-left:20px;font-size:.92rem}
nav a:hover,nav a:focus-visible{color:var(--cy)}
main{position:relative;z-index:2;pointer-events:none}
section{min-height:100vh;min-height:100svh;padding:0 24px;display:flex;flex-direction:column;justify-content:flex-end}
section>*{pointer-events:auto}
#hero{padding-bottom:calc(56px + env(safe-area-inset-bottom,0px))}
h1{font:700 clamp(3.4rem,15vw,10.5rem)/.95 Unbounded,sans-serif;margin:0;letter-spacing:-.02em;overflow:hidden;padding-bottom:.08em}
h1 span{display:inline-block;transform:translateY(115%);transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.go h1 span{transform:none}
.role{font-size:clamp(1rem,2.4vw,1.35rem);color:var(--mute);margin:14px 0 26px;max-width:34ch}
.hint{color:var(--cy);font-size:.9rem;margin:0}
.glass{background:rgba(11,16,34,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:22px;max-width:440px;margin-bottom:calc(48px + env(safe-area-inset-bottom,0px))}
.glass h2{font:500 clamp(1.4rem,3.4vw,2rem)/1.15 Unbounded,sans-serif;margin:6px 0 8px}
.glass p{margin:0;color:var(--mute)}
#count{color:var(--cy);font:700 .85rem Unbounded,sans-serif}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
button,.btn{font:700 .92rem Manrope,sans-serif;border-radius:9px;padding:11px 18px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--text);text-decoration:none;display:inline-block}
button:hover,.btn:hover{border-color:var(--cy)}
button:focus-visible,.btn:focus-visible,nav a:focus-visible{outline:2px solid var(--cy);outline-offset:3px}
.pri{background:var(--cy);color:#06101e;border-color:var(--cy)}
#contact ul{list-style:none;margin:14px 0 20px;padding:0;display:grid;gap:8px}
#contact li:before{content:"";display:inline-block;width:8px;height:8px;background:var(--pk);border-radius:50%;margin-right:10px}
#loader{position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;place-content:center;text-align:center;gap:10px;transition:opacity .8s}
#loader.off{opacity:0;pointer-events:none}
#ltc{font:700 clamp(1.8rem,7vw,3.2rem) Unbounded,sans-serif;color:var(--cy)}
#loader p{margin:0;color:var(--mute)}
#modal{position:fixed;inset:0;z-index:30;background:rgba(5,8,18,.94);display:grid;place-items:center;padding:20px}
#modal[hidden]{display:none}
#mv{width:min(1100px,100%);max-height:80vh;border-radius:10px;background:#000}
#close{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:16px}
.nogl #gl{display:none}
@media (max-width:640px){nav a{margin-left:12px}}
@media (prefers-reduced-motion:reduce){h1 span{transition:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="loader"><div id="ltc">00:00:00:00</div><p>Loading showreel</p></div>
<canvas id="gl" aria-hidden="true"></canvas>
<nav><b>RUDHRA</b><div><a href="#work">Work</a><a href="#contact">Contact</a></div></nav>
<main>
<section id="hero" data-state="hero">
<h1 id="name" aria-label="Rudhra">Rudhra</h1>
<p class="role" id="role">Video editor for creators and brands</p>
<p class="hint">Scroll to enter the reel</p>
</section>
<section id="work" data-state="work">
<div class="glass">
<div id="count">1 / 3</div>
<h2 id="vt"></h2>
<p id="vtag"></p>
<div class="ctrl"><button id="prev" aria-label="Previous video">Previous</button><button id="play" class="pri">Play full video</button><button id="next" aria-label="Next video">Next</button></div>
</div>
</section>
<section id="contact" data-state="hero">
<div class="glass">
<h2>Let’s cut your next video.</h2>
<ul><li>Short-form Reels and Shorts</li><li>YouTube long-form</li><li>Cinematic promos and color</li><li>Motion titles and captions</li></ul>
<a class="btn pri" id="mail" href="#contact">Email me</a>
</div>
</section>
</main>
<div id="modal" hidden><button id="close">Close</button><video id="mv" controls playsinline></video></div>
<script type="module" src="main.js"></script>
</body>
</html>
